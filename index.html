<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HALKA Shop BD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="logo-wrap">
      <img src="assets/logo1.png" alt="HALKA Shop BD logo">

    <h1>HALKA Shop BD</h1>
  </header>

  <main class="categories">
    <section class="category">
      <div class="photo"><img src="assets/toys.jpg" alt="Toys"></div>
      <h2>Toys</h2>
      <a class="btn" href="toys.html">Shop Toys</a>

    <section class="category">
      <div class="photo"><img src="assets/kitchen.jpg" alt="Kitchen"></div>
      <h2>Kitchen</h2>

    <section class="category">

      <h2>Fashion (Female)</h2>
      <a class="btn" href="fashion-female.html">Shop Fashion (Female)</a>

    <section class="category">

      <a class="btn" href="fashion-male.html">Shop Fashion (Male)</a>

  <footer class="footer">
    <p>&copy; <span id="year">2026</span> HALKA Shop BD. All rights reserved.</p>
    <nav class="footer-links">
      <a class="btn" href="affiliation.html">Affiliation</a>

      <a class="btn" href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
