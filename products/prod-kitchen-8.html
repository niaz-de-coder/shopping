<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Title | HALKA Shop BD</title>
  <link rel="stylesheet" href="product.css">
</head>
<body>

  <nav class="navbar">
    <a class="back-btn" href="kitchen.html">&larr; Back</a>
  </nav>

  <main class="product-page">

    <section class="media">
      <div class="main-photo">
        <img id="mainPhoto" src="assets/product/main.jpg" alt="Product Title">
      </div>

      <div class="gallery">
        <button class="thumb active" type="button" data-full="assets/product/gallery-1.jpg">
          <img src="assets/product/gallery-1.jpg" alt="Product photo 1">
        </button>
        <button class="thumb" type="button" data-full="assets/product/gallery-2.jpg">
          <img src="assets/product/gallery-2.jpg" alt="Product photo 2">
        </button>
        <button class="thumb" type="button" data-full="assets/product/gallery-3.jpg">
          <img src="assets/product/gallery-3.jpg" alt="Product photo 3">
        </button>
        <button class="thumb" type="button" data-full="assets/product/gallery-4.jpg">
          <img src="assets/product/gallery-4.jpg" alt="Product photo 4">
        </button>
      </div>
    </section>

    <section class="info">
      <p class="product-code">Code: KIT-001</p>
      <h1 class="product-title">Product Title</h1>
      <p class="product-variant">Variant: Standard</p>
      <p class="product-price">৳ 000</p>
      <p class="product-description">
        Write the product description here. Mention the material, size, features
        and anything else a customer should know before ordering.
      </p>
      <a class="btn" href="order.html">Order Now</a>
    </section>

  </main>

  <script src="product.js"></script>
</body>
</html>
